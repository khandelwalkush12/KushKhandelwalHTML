<html lang = "en">
     <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width=device-width, initial-scale=2.0">
        <title>Hotel Room Booking</title>
 </head>
</html>
<body bgcolor = "lightblue">
      <h1 align = "center">Hotel Room Booking</h1>
      <form action = "center" method = "post" style = "text-align: center ;">
        <label for = "name">Name:</label>
        <input type = "text" id = "name" name = "name" required><br><br>

        <label for = "email">Email:</label>
        <input type = "email" id = "email" name = "email" required><br><br>

        <label for = "checkin">Check-in Date:</label>
        <input type = "date" id = "checkin" name = "checkin" required><br><br>

        <label for = "checkout">Check-out Date:</label>
        <input type = "date" id = "checkout" name = "checkout" required><br><br>

        <label for = "roomtype">Room Type:</label>
        <select id = "roomtype" name = "roomtype">
            <option value = "single">Single</option>
            <option value = "double">Double</option>
            <option value = "suite">Suite</option>
        </select><br><br>
        <label for = "guests">Number of Guests:</label>
        <input   type = "number" id = "guests" name = "guests" min = "1" max = "10" required><br><br>
        <lable for = "specialrequests">Special Requests:</label>
           <textarea id = "specialrequests" name = "specialrequests" rows = "4" cols = "50"></textarea><br><br>    
        <input type = "checkbox" id = "terms" name = "terms" required>
        <label for = "terms">I agree to the terms and conditions</label><br><br>
        <button type = "submit" value ="Book Now">  Book Now</button>
        <button type = "reset" value = "Reset form">reset</button>


        <input type = "submit" value = "Book Now">  
    </form>
    </body>
